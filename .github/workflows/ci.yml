name: local-contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/twinlight.py demo --out outputs/demo
      - run: node --check outputs/demo/compiled-check.js
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_capacity.py
      - run: python scripts/verify_browser.py --html outputs/demo/index.html --out verification/browser --require-webgl
