name: local-contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/lock_template.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/twinlight.py demo --out outputs/demo
      - run: python scripts/twinlight.py demo --pipeline --out outputs/demo-pipeline
      - run: node --check outputs/demo/compiled-check.js
      - run: node --check assets/lite/lite.js
      - run: node --check assets/viewer/viewer.js
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_capacity.py
      - run: python scripts/verify_browser.py --html outputs/demo/index.html --out verification/browser --require-webgl
      - run: python scripts/verify_browser.py --html outputs/demo-pipeline/index.html --out verification/browser-pipeline --require-webgl
      - run: python scripts/verify_layout.py --out verification/layout --skip-continuous
      - name: Default independent modules, controlled resume and automatic integration
        run: |
          mkdir -p verification/controlled
          python scripts/twinlight.py run tests/fixtures/lite/valid.json --workspace runs/controlled --mode both > verification/controlled/first.json
          python - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          sys.path.insert(0, 'tests')
          from twinlight_core.common import load
          from twinlight_core.lite import persona_digest
          from test_card_art import native_fixture
          first = load(Path('verification/controlled/first.json'))
          assert first['status'] == 'needs_card', first['status']
          assert Path(first['outputs']['html']).is_file()
          # Synthetic fixtures exercise orchestration, not fresh image generation or art quality.
          native_fixture(Path('runs/controlled/native'), persona_digest(load(Path('tests/fixtures/lite/valid.json'))))
          EOF
          python scripts/twinlight.py run tests/fixtures/lite/valid.json --workspace runs/controlled --mode both --layers runs/controlled/native/layers.json > verification/controlled/final.json
          python - <<'EOF'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from twinlight_core.common import load
          from twinlight_core.template_origin import verify_site
          result = load(Path('verification/controlled/final.json'))
          assert result['status'] == 'files_ready', result['status']
          assert result['dynamic_verified'] is True
          assert result['quality_verified'] is False
          assert result['generation_provenance_verified'] is False
          assert result['stages']['html']['reused'] is True
          for key in ('html', 'card_front', 'card_preview', 'card_pack', 'html_with_card'):
              assert Path(result['outputs'][key]).is_file(), key
          assert verify_site(Path(result['outputs']['html_with_card']))['ok']
          assert load(Path('runs/controlled/site-with-card/profile.json'))['release'] == {'draft': True, 'share_allowed': False}
          EOF
      - name: Compatibility local preview, end to end through the state machine
        run: |
          TL="python scripts/twinlight.py"
          W=runs/ci
          $TL start --workspace $W --preview
          cp examples/lite/example.json $W/twinlight.json
          $TL check --workspace $W
          $TL check --workspace $W
          python - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          sys.path.insert(0, 'tests')
          from twinlight_core.common import load
          from twinlight_core.cardgen import card_spec
          from test_card_art import native_fixture
          data = load(Path('runs/ci/twinlight.json'))
          spec = card_spec(data, generated_at='2026-10-03T00:00:00Z')
          # Synthetic independent RGBA layers exercise ownership and full-canvas registration.
          # No green screen, segmentation, image-model calls or personal history.
          native_fixture(Path('runs/ci/card'), spec['persona_digest'])
          EOF
          $TL check --workspace $W
          $TL check --workspace $W
          $TL check --workspace $W
          $TL check --workspace $W
          python - <<'EOF'
          import json
          from pathlib import Path
          s = json.load(open('runs/ci/state.json', encoding='utf-8'))['stages']
          bad = {k: v['status'] for k, v in s.items() if v['status'] != ('skipped' if k == 'review' else 'passed')}
          assert not bad, bad
          assert 'user_reply' not in s['review']['detail'], s['review']['detail']
          profile = json.load(open('runs/ci/site/profile.json', encoding='utf-8'))
          assert profile['release']['draft'] is True, profile['release']
          assert profile['release']['share_allowed'] is False, profile['release']
          assert Path('runs/ci/card/front.png').is_file()
          assert Path('runs/ci/site/index.html').is_file()
          assert s['visual']['detail']['verified'] is True, s['visual']['detail']
          assert s['art']['detail']['art_mode'] == 'layered', s['art']['detail']
          assert s['art']['detail']['binding'] == 'persona_digest', s['art']['detail']
          print('card and HTML ready in one workflow; review remains unconfirmed; browser check verified')
          EOF
      - name: Viewer, driven like a user
        run: |
          python scripts/build_viewer.py --out outputs/viewer
          cmp viewer.html outputs/viewer/index.html
          python scripts/verify_viewer.py --out verification/viewer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-checks
          path: |
            verification/
            runs/ci/report.html
            runs/ci/visual/
            runs/controlled/browser/
          if-no-files-found: ignore
